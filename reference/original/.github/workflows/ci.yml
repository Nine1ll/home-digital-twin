name: CI

# 언제 실행할지: main으로의 push, 그리고 모든 PR
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub이 제공하는 리눅스 서버에서 실행

    steps:
      # 1. 저장소 코드를 가져옴
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 파이썬 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 테스트 실행
      - name: Run tests
        run: pytest -v