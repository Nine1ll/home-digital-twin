# 새 마이그레이션 만들기: alembic revision --autogenerate -m "설명"
# DB 주소는 DATABASE_URL 환경변수를 쓴다(backend/db.py)
[alembic]
script_location = backend/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
