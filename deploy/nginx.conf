# 화면(정적 파일)을 주고 /api는 API 서버로 넘긴다.
# 브라우저는 주소 하나만 보므로 CORS 설정이 필요 없다.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;  # 사진 인식 최대 5MB

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # 사진 인식은 오래 걸릴 수 있다
    }

    # 서비스워커와 설정은 캐시하지 않아야 새 버전이 바로 반영된다
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /config.js {
        add_header Cache-Control "no-cache";
    }
}
