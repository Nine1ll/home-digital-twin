name: Check reference implementation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: node --check frontend/app.js
      - run: node --check frontend/api.js
      - run: node --check frontend/sw.js
  e2e:
    # 세 서버(web·api·ml)를 compose로 띄우고 실제 브라우저로 폰 화면을 조작한다.
    # 이미지 빌드와 compose 설정 검증도 여기서 함께 된다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: bash e2e/stack.sh up
      - run: npm test
        working-directory: e2e
      - if: failure()
        run: bash e2e/stack.sh logs
      - if: always()
        run: bash e2e/stack.sh down
